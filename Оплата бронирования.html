<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Мяу-Мяу Кафе</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

<style>
@font-face{
    font-family:'Smeshariki';
    src:url('fonts/smeshariki.ttf') format('truetype');
}

@font-face{
    font-family:'Alumni';
    src:url('fonts/alumni.ttf') format('truetype');
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:'Alumni', sans-serif;

    background:linear-gradient(
        180deg,
        #FFDBDB 0%,
        #e0b0b0 35%,
        #ce8d8d 70%,
        #b96d6d 100%
    );

    color:#5b1111;
    min-height:100vh;

    overflow-x:hidden;
}


/* HEADER */

header{

    padding:25px 300px;

    background:transparent;
}
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{

    display:block;

    text-decoration:none;
}

.logo img{

    width:170px;

    display:block;
}

.logo h1{
    font-size:16px;
    font-weight:600;
}

nav{
    display:flex;
    gap:14px;
    align-items:center;
    flex-wrap:wrap;
}

nav a{
    font-family:'Smeshariki', sans-serif;
    text-decoration:none;

  background:#EEADAD;

    color:#5b1111;

    min-width:95px;
    height:66px;

    padding:12px 16px;

    border-radius:40px;

    font-size:20px;
    font-weight:400;
    line-height:1.1;
    text-align:center;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 3px 6px rgba(0,0,0,0.15);

    border:2px solid #EF9999;

    transition:0.3s;
}

nav a:hover{
    transform:translateY(-2px);

    background:linear-gradient(
        180deg,
        #e8b5b5 0%,
        #D67979 100%
    );
}

.login{

    font-family:'Smeshariki', sans-serif;

    font-size:15px;

    font-weight:400;

    margin-top:10px;

    text-align:right;

    display:block;

    color:#5b1111;

    text-decoration:none;

    transition:0.3s;
}
.login:hover{

    color:#7a1d1d;

    text-decoration:underline;
}

/* =========================
   TITLE
========================= */

.title{

    text-align:center;

    margin-top:10px;

    font-family:'Smeshariki';

    font-size:92px;

    color:#651313;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;
}

/* =========================
   PAYMENT BOX
========================= */

.pay-box{

    width:900px;

    height:580px;

    background:#e49797;

    border-radius:70px;

    margin:30px auto;

    padding:60px 90px;
}

/* =========================
   LABEL
========================= */

.label{

    font-family:'Smeshariki';

    font-size:46px;

    color:#5b1111;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;

    margin-left:20px;

    margin-bottom:15px;
}

/* =========================
   CARD INPUT
========================= */

.card-input{

    width:100%;

    height:90px;

    border:none;

    border-radius:45px;

    background:#f0d5d5;

    padding:0 35px;

    font-size:34px;

    margin-bottom:55px;

    outline:none;

    color:#651313;
}

/* =========================
   BOTTOM
========================= */
.bottom{
    display:flex;
    gap:50px;
    align-items:flex-start;
}

.date-box,
.code-box{
    font-family:'Smeshariki';

    font-size:42px;

    color:#5b1111;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;

        
    display:flex;
    flex-direction:column;
    align-items:flex-start;

}

.date-input,
.small-input{
    width:220px;
    height:60px;

    border:none;
    border-radius:20px;

    padding:0 20px;

    margin-top:15px;
    margin-left:0;

    font-size:28px;
}

.code-label{

    font-family:'Smeshariki';

    font-size:42px;

    color:#5b1111;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;

    margin-left:20px;

    
}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <div class="top-bar">

           <a href="Главная.html" class="logo">

                <img src="Лого.svg" alt="Лого">

           </a>

            <div>

                <nav>
                  <a href="Забронировать визит.html">
                        Забронировать <br> визит
                    </a>

                    <a href="Меню.html">
                        Меню
                    </a>

                    <a href="Наши котики.html">
                        Наши <br> котики
                    </a>

                    <a href="О нас.html">
                        О нас
                    </a>

                    <a href="Поддержать котиков.html">
                        Поддержать <br> котиков
                    </a>
                </nav>

                <a href="Регистрация.html" class="login">
                    Регистрация/Вход
                </a>
            </div>

        </div>

    </header>


    <div class="title">
    Оплатить бронирование:
    </div>

<section class="pay-box">

    <div class="label">
        Номер карты:
    </div>

    <input
        type="text"
        class="card-input"
    >

    <div class="bottom">

    <div class="date-box">

        <label class="date-label">
            Срок действия карты:
        </label>

        <input
            type="text"
            class="date-input"
            placeholder="MM/YY"
            maxlength="5"
        >

    </div>
    <script>

    const dateInput = document.querySelector('.date-input');

    dateInput.addEventListener('input', (e) => {

        let value = e.target.value.replace(/\D/g, '');

        if(value.length >= 3){
            value = value.slice(0,2) + '/' + value.slice(2,4);
        }

        e.target.value = value;
    });

</script>

    <div class="code-box">

        <label class="code-label">
            CVV:
        </label>

        <input
            type="password"
            class="small-input"
            maxlength="3"
        >

    </div>

</div>

</section>

</div>

</body>
</html>
